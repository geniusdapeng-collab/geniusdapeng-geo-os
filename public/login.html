<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>登录 · 鹏经理系统</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/operations.css" />
  </head>
  <body class="login-page">
    <main class="login-card panel">
      <a href="/" class="login-brand"><span class="brand-mark">鹏</span><span>鹏经理系统<small>PengManager System</small></span></a>
      <p class="eyebrow">PRIVATE WORKSPACE</p>
      <h1>回到经营工作台</h1>
      <p class="login-copy">登录后管理账号、准备内容，并查看每次发布与回复的真实回执。</p>
      <form id="login-form">
        <label><span>管理员密码</span><input type="password" name="password" required minlength="12" maxlength="1024" autocomplete="current-password" autofocus /></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="primary-button" type="submit">登录管理后台</button>
      </form>
      <p class="login-note">社媒账号仍在本机浏览器登录。此处仅验证管理后台身份。</p>
      <a class="text-link" href="/">返回个人主页</a>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
