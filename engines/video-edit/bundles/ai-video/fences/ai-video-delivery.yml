# 交付包 · 多风格变体 · 本地返修围栏包（视频经理 · 后期交付与返修工位）
# 与 ai-video-subtitle.yml / ai-video-color.yml / ai-video-bgm.yml 同口径：默认基线、只可加严、
# 命中取严（block > review > auto）；求值语义：匹配命中后求值 when（沙箱，禁任意代码），
# 写类动作无命中按 default_level。
#
# 这一包拦的是"多版本交付 + 返修"里最贵、最不可逆的四件事：
#   ① 声称派生已完成却缺少实际请求产物；
#   ② 把字幕烧进母版（画面像素被改，之后"不要字幕"的诉求只能重剪）；
#   ③ 返修时不做影响分析就整体重跑（把"后期能解决的事"变成"重新生成镜头"的账单）；
#   ④ 交付不带清单/工程文件（用户选不了、事后对不了账，返修也没有输入）。
version: ai-video-delivery/v2
default_level: review
rules:
  - rule_id: G-DLV0
    name: 交付包派生与旁挂字幕（本地可逆动作直通）
    level: auto
    is_baseline: true
    match:
      object_types: [final_video, video_asset, subtitle_track, subtitle_report, delivery_package]
      actions: [postread.health, postread.plan, postread.impact, postread.quality, postwrite.package, postwrite.reedit, postwrite.triage, subtitlewrite.sidecar, subtitlewrite.softmux]
    when: "true"
    note: 派生变体、出旁挂字幕文件、软字幕轨内嵌、按 patch 本地重合成，都是工位本地、非破坏、可回滚动作（原片只读 + 版本只增不覆盖 + 产物带 sha256），默认直通。覆盖原片（G-DLV2）、改变软字幕编码轨道（G-DLV3）、产物缺件（G-DLV1）、返修跳过影响分析（G-DLV4）、缺清单（G-DLV6）、复用无证据（G-DLV7）叠加升级，deny 优先并集取严。未命中写动作的保守默认是 review，故此处必须显式声明 auto。

  - rule_id: G-DLV1
    name: 请求产物与当前媒体的技术验收
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video]
      actions: [postwrite.package, postwrite.reedit]
    when: "params.output_missing == true or params.output_unreadable == true or params.post_quality_failed == true or params.output_missing == true or params.output_unreadable == true"
    note: 保留本仓请求的版本数量合同；实际缺件、完整解码失败、原生或明确目标规格不符、请求环节及真实加工证据缺失均失败。执行器出口重新检查当前字节，调用方通过标志不能替代。艺术评分不作通用硬闸；技术失败只本地返修，不自动付费重生成。


  - rule_id: G-DLV2
    name: 母版不得烧字幕（字幕一律旁挂/软轨交付）
    level: block
    is_baseline: true
    match:
      object_types: [final_video, video_asset, delivery_package]
      actions: [postwrite.package, postwrite.reedit, subtitlewrite.softmux]
    when: "params.master_burned_in == true or params.burn_into_master == true or params.overwrite_source == true or params.output_path in [params.input_path]"
    note: 硬线：**母版永远是"无字画面"**。有些片子要带字幕、有些不要，而"要不要"是发布时的选择；烧一次就回不去了（像素被改，想拿掉只能重剪）。要硬字幕必须另存副本（`*.burned.mp4`），母版保持干净；软字幕轨走 softmux（视频/音频轨 copy，完整编码轨道哈希核对）。

  - rule_id: G-DLV3
    name: 软字幕轨必须保留原编码轨道
    level: block
    is_baseline: true
    match:
      object_types: [final_video, subtitle_track, delivery_package]
      actions: [subtitlewrite.softmux, postwrite.package, postwrite.reedit]
    when: "params.reencode_video == true or params.allow_video_reencode == true"
    note: 软字幕内嵌必须 copy 原视频和音频编码轨道，并强制核对完整轨道字节哈希、实际时间轴和字幕轨数量；这些是处理回执。legacy verify/skip_verify 不再触发质量审批，也不会关闭实际文件和轨道检查。

  - rule_id: G-DLV4
    name: 返修必须先做影响分析；能在本地重合成的不得走镜头重生成
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video, render_job]
      actions: [postwrite.reedit, postwrite.package]
    when: "params.skip_impact_analysis == true or params.impact_analyzed == false or (params.requires_shot_regeneration == true and params.shot_ids_missing == true)"
    note: 镜头生成是贵的、后期是便宜的，所以返修必须走"先分析后动手"：字幕/文案/封面/配乐/调色/转场这些能在本地重合成的一律本地做；只有点名到**画面内容**才允许重生成镜头，而且必须逐镜点名（说不出是第几个镜头就不许重跑整片）。

  - rule_id: G-DLV5
    name: 镜头重生成（花钱）人审
    level: review
    is_baseline: true
    match:
      object_types: [render_job, video_asset, delivery_package]
      actions: [postwrite.reedit, postwrite.package, render.submit]
    when: "params.requires_shot_regeneration == true or params.regenerate_shots == true"
    note: 重生成镜头会烧渲染额度（与 G8 同源风险）。因此：只出计划、不自动执行；人审放行后只重跑被点名的镜头，其余镜头与全部后期层复用（复用必须带哈希证据，见 G-DLV7）。

  - rule_id: G-DLV6
    name: 交付必须带清单与工程文件
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video]
      actions: [postwrite.package, postwrite.reedit]
    when: "params.delivery_manifest == false or params.engineering_file == false or params.skip_manifest == true"
    note: 「没有清单就不是交付」：`delivery-manifest.json`（每个产物的 sha256/规格/变体处理配方与质量未复检声明/成本口径）与 `film-project.json`（层结构 + 产物血缘，返修的输入）缺一不可。缺了它们，用户选不了版本、事后对不了账、下一轮返修也没有可复用的层描述。

  - rule_id: G-DLV7
    name: 「复用」必须带证据（不得声称复用却重算）
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video]
      actions: [postwrite.reedit, postwrite.package]
    when: "params.reuse_without_evidence == true or params.claim_reuse_without_hash == true"
    note: 返修回执里"复用了哪些层"必须能对账：复用产物给出 sha256 与 mtime 未变的证据，重算产物给出新 sha256；镜头层还要与工程文件里记录的哈希逐镜比对，不一致就如实标注"被外部改动过"。禁止把"重算了但没写清楚"包装成"复用"。

  - rule_id: G-DLV8
    name: UHD 母版与变体必须回读到目标画布
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video]
      actions: [postwrite.package, postwrite.reedit]
    when: "params.uhd_requested == true and params.resolution_exact == false"
    note: 申请 UHD 时必须以 ffprobe 回读母版和每个变体的实际目标宽高，并保留源片规格、来源哈希与真实加工回执；普通请求由本地合成器按目标画布编码，不自动触发增强模型。

  - rule_id: G-DLV9
    name: 明确请求的增强操作必须执行成功
    level: block
    is_baseline: true
    match:
      object_types: [delivery_package, final_video]
      actions: [postwrite.package, postwrite.reedit]
    when: "params.enhancement_requested == true and params.enhancement_execution_succeeded == false"
    note: 仅在用户明确请求增强时检查该操作是否实际执行成功；申请输出画布不自动触发模型增强或源质量检查。原始规格、源哈希、产物哈希和实际处理回执仍需保留。
