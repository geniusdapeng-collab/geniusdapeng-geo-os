# 真实素材用途围栏包（视频经理 · 素材镜）
# 与 ai-video-baseline.yml / ai-video-color.yml / ai-video-bgm.yml 同口径：默认基线、只可加严、
# 命中取严（block > review > auto）；求值语义：匹配命中后求值 when（沙箱，禁任意代码），
# 写类动作无命中按 default_level。
#
# 本包守的是产品所有者 2026-09-25 定的**一条硬规定**：
#   真实图片/视频素材**只作生成输入**（渲染素材），严禁在视频里直接静态展示素材本身；
#   素材镜必须能证明"画面由生成模型产出"（渲染任务号 + 素材/产物指纹），
#   成功渲染后直接进入正式后期，不再进行源画面品质投票。
version: ai-video-material/v2
default_level: review
rules:
  - rule_id: G-MAT0
    name: 素材镜走生成（工位本地、非破坏、可回滚）直通
    level: auto
    is_baseline: true
    match:
      object_types: [material_asset, render_job, video_asset, final_video]
      actions: [material.write, material.prepare, material.generate, render.write]
    when: "true"
    note: 素材的登记、画幅准备与"交给生成模型出片"都是工位本地、非破坏、可回滚动作（素材只读 + 新文件 + sha256 回执），默认直通；静态直出（G-MAT1）、缺生成溯源（G-MAT2）叠加升级，deny 优先并集取严。未命中写动作的保守默认是 review，故此处必须显式声明 auto。

  - rule_id: G-MAT1
    name: 素材静态直出一票否决（素材只能当生成输入）
    level: block
    is_baseline: true
    match:
      object_types: [final_video, video_asset, material_asset, render_job]
      actions: [material.write, material.prepare, material.display, render.write, render.submit, render.script.gen, portrait.render, explainerwrite.render, publish.execute]
    when: "params.material_usage != 'generation-reference' or params.static_display == true or params.reuse_material_frame == true or params.photo_as_shot == true"
    note: "产品所有者 2026-09-25 硬规定：素材是**渲染素材**，不是成片内容。缺用途声明（material_usage 缺失或写 direct-display/static-display/slideshow）、把素材原样或经裁切/缩放/推拉/滤镜包装后当镜头入时间线（static_display/reuse_material_frame/photo_as_shot 任一为 true）一律阻断，审批也不能放行（人无权绕过产品口径）。DSL 语义：material_usage 缺失 → 左值 undefined != 'generation-reference' 为真 → 阻断（fail-closed，缺声明按违规处理）。"

  - rule_id: G-MAT2
    name: 素材镜必须带生成溯源（无回执不算完成）
    level: review
    is_baseline: true
    match:
      object_types: [material_asset, render_job, video_asset]
      actions: [material.write, material.generate, render.write]
    when: "params.material_usage == 'generation-reference' and (not contains(params.render_task_id, params.render_task_id) or not contains(params.model, params.model) or not contains(params.source_material_sha256, params.source_material_sha256) or not contains(params.output_sha256, params.output_sha256))"
    note: 素材镜提交/回填必须能证明"这一镜真的由生成模型产出"：渲染任务号、模型名、素材指纹、产物指纹四件齐备。缺失、null、空字符串、布尔、数字或对象均不算证据，挂起人审；contains(x,x) 使用本仓合法 DSL，只有非空字符串成立，不使用不支持的 null token。真实渲染接受器另行核对任务范围、64 位哈希和当前字节。四件齐备且非静态直出时由 G-MAT0 直通。

  - rule_id: G-MAT3
    name: 成功渲染素材直接进入正式后期
    level: review
    is_baseline: true
    match:
      object_types: [material_asset, video_asset, final_video]
      actions: [material.generate, render.write]
    when: "false"
    note: 前置素材用途、授权和生成溯源保留。成功渲染产物核对真实任务、源/产物字节和可处理性后直接进入正式后期，不以地标、文字、构图、动作或身份质量要求人审、ASR、TTS 或再次渲染。

  - rule_id: G-MAT4
    name: 素材只作场景依据（禁止把参考图当首帧做动效）
    level: block
    is_baseline: true
    match:
      object_types: [material_asset, render_job, video_asset, final_video]
      actions: [material.generate, render.write, render.submit, portrait.render, explainerwrite.render]
    when: "params.reference_only != true or params.first_frame_from_reference == true or params.photo_as_first_frame == true"
    note: "产品所有者 2026-09-25 口径：**图片只是实景素材参考，是用来构建真实视频场景的**——素材必须以 reference_image（reference_only=true）提交，禁止当 first_frame；成片必须是模型构建出来的视频场景（自有 机位/视差/环境运动），不是「参考图被推动」。这些是提交前的输入形态约束；成功渲染产物不再抽取首帧/中段帧做 PSNR 或画面质量拒绝。DSL 语义：reference_only 缺失 → 左值 != true 成立 → 阻断（fail-closed）。"
