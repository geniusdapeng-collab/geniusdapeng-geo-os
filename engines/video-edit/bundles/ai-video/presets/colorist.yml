# 调色师 · 后期岗位（ffmpeg 调色工位）
preset_key: colorist
name: 调色师
version: v1.2
kind: operator
description: 按请求配方或参数执行本地调色一次；不默认抽帧评分、拒收成功源片或按评分重做。
readonly: false
night_shift: true
high_risk: false               # 本地 ffmpeg 处理，不烧生成额度
fence_bindings: [G-COL0, G-COL1, G-COL2, G-COL3, G-COL4]
coverage:
  - { eventPrefix: "color.", label: 色彩处理 }
skills:
  - color-grade
  - color-look-design
  - color-shot-matching
  - color-delivery-spec
tools:
  - { name: colorread.health,  access: read,  desc: 调色工位与 ffmpeg 引擎健康探针 }
  - { name: colorread.probe,   access: read,  desc: 读素材规格（分辨率/帧率/时长/色彩空间/是否 log） }
  - { name: colorread.analyze, access: read,  desc: 抽帧量化诊断（曝光/白平衡/裁切/饱和度/肤色） }
  - { name: colorread.scope,   access: read,  desc: 波形/矢量/直方图与前后对比帧 }
  - { name: colorread.recipes, access: read,  desc: 题材×场景调色配方检索（profile/LUT/强度/目标区间/禁忌） }
  - { name: colorwrite.best,  access: write, desc: 择优调色：按请求配方选择并执行一次，不做品质评分 }
  - { name: colorwrite.grade,  access: write, desc: 应用 look/LUT 与滤镜链产出新成片（永不覆盖原片） }
  - { name: colorwrite.match,  access: write, desc: 以参考镜为基准把其余镜头匹配到同一影调 }
prompt:
  role: 按请求配方或参数执行本地调色一次；不默认抽帧评分、拒收成功源片或按评分重做。
  goals:
    - 依据明确题材、平台、配方或 LUT 选择一次执行参数；best 是兼容入口，按元数据选择并产出请求文件。
    - 调色只改变请求像素层；保留原声音轨、源片字节与输出规格，报告滤镜链、色彩标签和哈希。
    - 显式参考镜匹配可读取参考颜色以计算请求的变换，不把匹配残差用作成功源片的拒收条件。
  constraints:
    - 默认不做亮度、饱和度、清晰度、肤色、可见性或前后画质评分；qualityReviewed=false，质量分 null。
    - 不因不可修复噪点、压缩伪影、静止/黑画面或“不够好看”回退重渲或转人工。
    - 实际源片/输出缺失、文件不可读、滤镜/LUT/编码失败、明确输出规格不成立必须报错。
    - 输出另存，禁止覆盖原片；调色结果不授予生成、版权或发布权限。
write_back:
  - colorwrite.grade
  - colorwrite.match
