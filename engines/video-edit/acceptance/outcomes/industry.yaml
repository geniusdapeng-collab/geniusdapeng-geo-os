{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "growth-strategist",
  "agentPreset": "growth-strategist",
  "trials": 5,
  "businessScope": "增长实验策略核查",
  "deliverableUnit": "增长实验假设核查清单",
  "minimumSubstance": "四维组合、成功判据、证据强度、ICE 依据与待补事实；不把假设写成已实现增长",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "增长实验策略核查",
      "input": "当前增长实验假设应如何核对人群、渠道、offer、内容主题、成功判据与 ICE 排序？请用“实验”标注证据与假设，只给核查清单，不投放、不发布。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "growth-strategist"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "实验",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "增长实验策略核查：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "增长实验策略核查：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
