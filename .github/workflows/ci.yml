name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pipeline-postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_PASSWORD: pipeline_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: |
          node --check src/server.mjs
          node --check src/application.mjs
          node --check src/http/video-runtime.mjs
          node --check public/app.js
          node --check public/video-workbench.js
          node --check public/operations.js
          node --check public/site.js
          node --check public/login.js
          node --check scripts/package-deployment.mjs
          node --check deploy/aliyun/configure.mjs
          for script in deploy/aliyun/*.sh; do bash -n "$script"; done
      - name: Deployment safety and recovery tests
        run: python3 -m unittest discover -s deploy/aliyun -p 'test_*.py'
      - name: Verify complete pinned video snapshot from clean checkout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyPinnedSnapshot } from './src/video-runtime/snapshot.mjs';
          const rootDir = process.cwd();
          const pin = JSON.parse(fs.readFileSync('upstreams/workloom-video-edit.pin.json', 'utf8'));
          console.log(JSON.stringify(verifyPinnedSnapshot({ rootDir, engineRoot: path.join(rootDir, pin.engineRoot), commit: pin.commit, fileCount: pin.sourceFileCount, expectedSha256: pin.snapshotSha256 })));
          NODE
      - name: Unit and integration tests
        run: node --test tests/*.test.mjs
      - name: Engine regression tests
        run: node --test engines/geo-evidence/test/*.test.mjs tests/integrated-engines.test.mjs
      - name: Install pinned complete video engine package manager
        working-directory: engines/video-edit
        run: |
          engine_manager=$(node -p "require('./package.json').packageManager")
          node --input-type=module -e "import fs from 'node:fs'; const manager = JSON.parse(fs.readFileSync('package.json', 'utf8')).packageManager; if (!/^pnpm@[0-9]+\.[0-9]+\.[0-9]+$/.test(manager)) throw new Error('Embedded package manager must be pinned exactly.');"
          npm install --global "$engine_manager"
          test "$(pnpm --version)" = "${engine_manager#pnpm@}"
      - name: Install complete video engine from pinned official UI release
        working-directory: engines/video-edit
        run: >-
          node scripts/ci/install-private-ui.mjs
          --repo .
          --store-dir "$RUNNER_TEMP/pengmanager-video-store"
          --staging-root "$RUNNER_TEMP"
          --archive "$RUNNER_TEMP/pengmanager-ui-original.tgz"
          --report "$RUNNER_TEMP/pengmanager-ui-bootstrap.json"
      - name: Verify official UI download and canonical installation boundary
        working-directory: engines/video-edit
        env:
          WORKLOOM_UI_TEST_ARCHIVE_PATH: ${{ runner.temp }}/pengmanager-ui-original.tgz
        run: node --test --test-concurrency=1 scripts/ci/ui-public-release.test.mjs scripts/ci/ui-auth-bootstrap.test.mjs scripts/ci/install-private-ui.test.mjs
      - name: Build complete native video workbench
        working-directory: engines/video-edit
        run: |
          pnpm --dir packages/industry-contract build
          pnpm --dir apps/web build
      - name: Typecheck complete native video server
        working-directory: engines/video-edit
        run: pnpm exec tsc --noEmit -p apps/server/tsconfig.json
      - name: Native video identity, onboarding and declared skill regression
        working-directory: engines/video-edit
        run: |
          pnpm exec vitest run --maxWorkers=1 \
            apps/server/src/service/desktop-auth.test.ts \
            apps/server/src/service/llm-environment.test.ts \
            apps/server/src/service/embedded-paths.test.ts \
            apps/server/src/service/onboarding-readiness.test.ts \
            apps/server/src/service/onboarding-truth.test.ts \
            apps/server/src/voice/station.test.ts \
            packages/runtime/src/declared-skill-context.test.ts \
            packages/runtime/src/loop.test.ts \
            packages/base/bundles/pengmanager-role-preservation.test.ts \
            packages/base/bundles/acquisition-loop.test.ts \
            packages/base/skills/official.test.ts
          node --test scripts/pengmanager-tools.test.mjs
          python3 scripts/pengmanager-asr.test.py
      - name: Embedded video engine tests
        run: npm run test:ci
      - name: Preproduction contracts and durable pipeline recovery
        working-directory: engines/video-edit
        env:
          WORKLOOM_TEST_ADMIN_URL: postgres://postgres:pipeline_ci_fixture@127.0.0.1:5432/postgres
          WORKLOOM_TEST_APP_PASSWORD: pipeline_test_app
          WORKLOOM_TEST_GATEWAY_PASSWORD: pipeline_test_gateway
        run: |
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism \
            packages/video-studio/src/constraint-compiler.test.ts \
            packages/video-studio/src/creative-evaluation.test.ts \
            packages/video-studio/src/creative-runtime.test.ts \
            packages/video-studio/src/video-text-client.test.ts \
            packages/video-studio/src/producer-gate.test.ts \
            packages/video-studio/src/portrait-runtime.test.ts \
            apps/server/src/video/creative-shadow.test.ts \
            packages/video-studio/src/product-visual-authority.test.ts \
            packages/video-studio/src/requirement-authority.test.ts \
            packages/video-studio/src/requirement-contract.test.ts \
            packages/video-studio/src/requirement-contract-production-bridge.test.ts \
            packages/video-studio/src/marketing-prompt-contract.test.ts \
            packages/video-studio/src/marketing-prd-contract.test.ts \
            packages/video-studio/src/studio.test.ts \
            packages/video-studio/src/pipeline-router.test.ts \
            packages/video-studio/src/prd-authority-bridge.test.ts \
            packages/video-studio/src/prd-authority.test.ts \
            packages/video-studio/src/vendor-compat.test.ts \
            packages/video-studio/src/archive/stage-log.test.ts \
            apps/server/src/video/render-archive-receipt.test.ts \
            apps/server/src/video/data-mining-executor.test.ts \
            apps/server/src/video/marketing-search-isolation.test.ts \
            apps/server/src/video/marketing-authority.test.ts \
            apps/server/src/video/marketing-gate-evidence.test.ts \
            apps/server/src/video/studio-start.test.ts \
            apps/server/src/video/studio-worker.test.ts \
            apps/server/src/video/production-authority.test.ts \
            apps/server/src/video/gen/compiled-request.test.ts \
            apps/server/src/video/gen/submit.test.ts \
            apps/server/src/video/gen/gen.test.ts \
            apps/server/src/video/pipeline/pipeline-repository.pg.test.ts \
            apps/server/src/video/pipeline/pipeline-command-replay.pg.test.ts \
            apps/server/src/video/pipeline/pipeline-frontier.pg.test.ts
      - name: Qualified creative generation with real PostgreSQL scope and recovery
        working-directory: engines/video-edit
        env:
          WORKLOOM_TEST_ADMIN_URL: postgres://postgres:pipeline_ci_fixture@127.0.0.1:5432/postgres
          WORKLOOM_TEST_APP_PASSWORD: pipeline_test_app
          WORKLOOM_TEST_GATEWAY_PASSWORD: pipeline_test_gateway
          DATABASE_URL: postgres://postgres:pipeline_ci_fixture@127.0.0.1:5432/video_architecture_fixture
          DATABASE_APP_URL: postgres://workloom_app:pipeline_test_app@127.0.0.1:5432/video_architecture_fixture
          DATABASE_GATEWAY_URL: postgres://workloom_gateway:pipeline_test_gateway@127.0.0.1:5432/video_architecture_fixture
          APP_DB_PASSWORD: pipeline_test_app
          GATEWAY_DB_PASSWORD: pipeline_test_gateway
          RUN_DB_TESTS: "1"
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const url = new URL(process.env.DATABASE_URL);
          url.pathname = '/postgres';
          const client = new pg.Client({ connectionString: url.toString() });
          await client.connect();
          try { await client.query('CREATE DATABASE video_architecture_fixture'); }
          finally { await client.end(); }
          NODE
          node --import tsx scripts/migrate.ts
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism \
            apps/server/src/video/production-authority.pg.test.ts \
            apps/server/src/video/creative-render-binding.pg.test.ts \
            apps/server/src/video/creative-service.pg.test.ts \
            apps/server/src/video/creative-evaluation-matrix.pg.test.ts
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Secret scan
        run: node scripts/security-scan.mjs
